spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8889
  servlet:
      context-path: /api/users
kafka:
  topic:
    user-events: create_user
  consumer:
    group-id: user-service-group
